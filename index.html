<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f6b4c">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/game-plaza-icon.svg">
  <title>ゲームひろば｜ゲーム・パズル・便利アプリ</title>
  <meta name="description" content="登録不要ですぐに遊べる、ゲーム・パズル・便利アプリのひろばです。">

  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/home.css">
  <script src="/assets/ui.js"></script>
  <script src="/assets/home.js" defer></script>
</head>
<body class="home-page">
  <main class="home-shell">
    <header class="home-hero">
      <div class="hero-copy">
        <p class="eyebrow">登録不要・無料ですぐに使えます</p>
        <h1>ゲームひろば</h1>
        <p class="hero-lead">
          ゲーム、パズル、便利なアプリを集めたひろばです。<br>
          気になるものを選んで、ゆっくりお楽しみください。
        </p>
        <a class="hero-button" href="#works">作品を見る <span aria-hidden="true">↓</span></a>
        <button class="install-button" id="install-button" type="button" hidden>📱 ホーム画面に追加</button>
        <p class="install-help" id="install-help" hidden></p>
      </div>
      <div class="hero-mark" aria-hidden="true">
        <span>遊</span>
        <small>GAME<br>PLAZA</small>
      </div>
    </header>

    <section class="catalog" id="works" aria-labelledby="catalog-title">
      <div class="section-heading">
        <div>
          <p class="section-kicker">いま公開しているもの</p>
          <h2 id="catalog-title">作品一覧</h2>
        </div>
        <p class="result-count" id="result-count" aria-live="polite">読み込み中です</p>
      </div>

      <div class="catalog-tools">
        <div class="filter-list" id="filter-list" aria-label="種類で絞り込む"></div>
      </div>

      <div class="work-grid" id="work-grid"></div>
      <p class="empty-message" id="empty-message" hidden>
        選んだ種類の作品は、まだありません。
      </p>

      <noscript>
        <p class="load-error">作品一覧を表示するには、ブラウザのJavaScriptを有効にしてください。</p>
      </noscript>
    </section>

    <section class="about-panel" aria-labelledby="about-title">
      <div class="about-icon" aria-hidden="true">☕</div>
      <div>
        <h2 id="about-title">あせらず、ゆっくり</h2>
        <p>時間の制限はありません。まちがえても、何度でもやりなおせます。新しい作品も少しずつ追加していきます。</p>
      </div>
    </section>

    <footer class="home-footer">
      <p>ゲームひろば</p>
      <a href="#works">作品一覧へ戻る ↑</a>
    </footer>
  </main>
</body>
</html>
