<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スライドパズル｜ゲームひろば</title>

<link rel="stylesheet" href="/assets/base.css">
<script src="/assets/ui.js"></script>

<style>
/* ------------------------------------------------------------
   スライドパズルだけの見た目。
   色・文字サイズ・ボタンの共通設定は base.css にあります。

   var(--accent, #146c48) の2つ目の色は、万一 base.css が
   読めなかったときの「予備の色」です。
   ------------------------------------------------------------ */

.console { max-width: 30rem; }

/* ---- ゲームをえらぶ ---- */

.modes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
  margin-bottom: 0.8rem;
}

.mode-btn {
  min-height: 3.2rem;
  padding: 0.5rem 0.4rem;
  border: 2px solid var(--border, #b9c7c0);
  border-radius: 0.5rem;
  background: #ffffff;
  color: var(--text-dim, #3d4b46);
  font-family: var(--font, "Yu Gothic UI", "Meiryo", sans-serif);
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
}

.mode-btn:hover { border-color: var(--accent-2, #1f8a63); }

.mode-btn[aria-pressed="true"] {
  border-color: var(--accent, #146c48);
  background: var(--accent, #146c48);
  color: #ffffff;
}

/* ---- 盤面 ---- */

.board {
  display: grid;
  gap: 0.3rem;
  width: 100%;
  max-width: 22rem;
  margin: 0 auto;
  padding: 0.35rem;
  aspect-ratio: 1 / 1;
  background: #d8e2dc;
  border: 2px solid var(--border, #b9c7c0);
  border-radius: 0.6rem;
}

.tile {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #a8bdb2;
  border-radius: 0.45rem;
  background: #ffffff;
  color: var(--accent, #146c48);
  font-family: var(--font, "Yu Gothic UI", "Meiryo", sans-serif);
  font-weight: 800;
  line-height: 1;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  transition: background .12s ease;
}

.tile:hover { background: #e6f4ec; }

.tile.empty {
  background: #cfdcd5;
  border-style: dashed;
  cursor: default;
}

.board[data-cols="3"] .tile { font-size: min(3rem, 14vw); }
.board[data-cols="4"] .tile { font-size: min(2.1rem, 10vw); }

/* ---- いまの手数・時間 ---- */

.now-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.4rem;
  margin-top: 0.6rem;
}

.stat {
  padding: 0.4rem 0.3rem;
  text-align: center;
  background: var(--card, #fbf9f2);
  border: 1px solid var(--border, #b9c7c0);
  border-radius: 0.4rem;
  color: var(--text-dim, #3d4b46);
  font-size: 0.9rem;
  font-weight: 700;
}

.stat b {
  display: block;
  margin-top: 0.1rem;
  color: var(--text, #1a2622);
  font-size: 1.3rem;
}

/* ---- できました ---- */

.win-banner {
  display: none;
  margin-top: 0.6rem;
  padding: 0.7rem;
  text-align: center;
  color: var(--accent, #146c48);
  background: #e7f4ed;
  border: 2px solid var(--accent-2, #1f8a63);
  border-radius: 0.5rem;
  font-size: 1.15rem;
  font-weight: 800;
}

.win-banner.show { display: block; }

/* ---- 操作 ---- */

.controls {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.6rem;
}

.controls .btn { flex: 1; }

.record-line {
  display: flex;
  justify-content: space-between;
  gap: 0.7rem;
  margin-bottom: 0.5rem;
  color: var(--text-dim, #3d4b46);
  font-size: 1rem;
  font-weight: 700;
}

.record-line b { color: var(--accent, #146c48); font-size: 1.1rem; }

/* ---- 紙ふぶき ---- */

.confetti-layer {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 9999;
}

.confetti {
  position: absolute;
  top: -20px;
  width: 10px;
  height: 16px;
  border-radius: 2px;
  animation: fall linear forwards;
}

@keyframes fall {
  to { transform: translate3d(var(--drift), 110vh, 0) rotate(720deg); }
}

/* ---- 画面がせまいとき（このブロックは1つだけ。増やさないでください） ---- */

@media (max-width: 560px) {
  .back-link { display: block; text-align: center; }
  .controls  { flex-direction: column; }
}
</style>
</head>
<body>
<div class="confetti-layer" id="confettiLayer"></div>

<main class="console">
  <a class="back-link" href="/">← ゲームひろばへ もどる</a>

  <h1>スライドパズル</h1>
  <p class="subtitle">数字を 順番に ならべて 完成させましょう</p>

  <div class="modes">
    <button type="button" class="mode-btn" id="mode9"  aria-pressed="true">9パズル<br>（3×3）</button>
    <button type="button" class="mode-btn" id="mode15" aria-pressed="false">15パズル<br>（4×4）</button>
  </div>

  <div class="board" id="board" data-cols="3" aria-label="スライドパズルの盤"></div>

  <div class="win-banner" id="winBanner">できました！ お見事です。</div>

  <div class="now-stats">
    <div class="stat">手数<b id="moveCount">0</b></div>
    <div class="stat">かかった時間<b id="timeCount">00:00</b></div>
  </div>

  <div class="controls">
    <button type="button" class="btn" id="shuffleBtn">シャッフル</button>
    <button type="button" class="btn secondary" id="resetBtn">さいしょに もどす</button>
  </div>

  <details class="records-box">
    <summary>これまでの記録を見る</summary>
    <div>
      <div class="record-line">
        <span id="bestModeName">9パズル</span>
        <span>手数 <b id="bestMoves">―</b></span>
        <span>時間 <b id="bestTime">―</b></span>
      </div>
      <div class="controls">
        <button type="button" class="btn secondary" id="clearRecordsBtn">記録を消す</button>
      </div>
    </div>
  </details>

  <div class="how-to">
    ① 空いているマスの となりの数字を 押すと 動きます。<br>
    ② 「シャッフル」で ばらばらにして、はじめます。<br>
    ③ 1から順に ならべば 完成です。時間の せいげんは ありません。
  </div>
</main>

<script>
(() => {
  "use strict";

  const boardEl      = document.getElementById("board");
  const winBanner    = document.getElementById("winBanner");
  const moveCountEl  = document.getElementById("moveCount");
  const timeCountEl  = document.getElementById("timeCount");
  const bestMovesEl  = document.getElementById("bestMoves");
  const bestTimeEl   = document.getElementById("bestTime");
  const bestModeEl   = document.getElementById("bestModeName");
  const confettiLayer= document.getElementById("confettiLayer");
  const mode9Btn     = document.getElementById("mode9");
  const mode15Btn    = document.getElementById("mode15");

  let size = 3;
  let tiles = [];
  let emptyIndex = 0;
  let moveCount = 0;
  let seconds = 0;
  let timerId = null;
  let started = false;
  let solved = false;
  let audioCtx = null;

  /* 音を鳴らしてよいか。ui.js の設定を見ます */
  function soundOn() { return !window.GH || window.GH.soundEnabled(); }

  function storageKey() { return "slidePuzzleBest_" + size; }

  function readStore(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  function writeStore(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }

  function formatTime(total) {
    const m = String(Math.floor(total / 60)).padStart(2, "0");
    const s = String(total % 60).padStart(2, "0");
    return m + ":" + s;
  }

  /* ---- 記録 ---- */

  function loadBest() {
    let saved = null;
    try { saved = JSON.parse(readStore(storageKey()) || "null"); } catch (e) {}
    bestMovesEl.textContent = (saved && saved.moves != null) ? saved.moves + "手" : "―";
    bestTimeEl.textContent  = (saved && Number.isFinite(saved.seconds)) ? formatTime(saved.seconds) : "―";
    bestModeEl.textContent  = (size === 3) ? "9パズル" : "15パズル";
  }

  function saveBest() {
    let cur = null;
    try { cur = JSON.parse(readStore(storageKey()) || "null"); } catch (e) {}
    const newMoves = !cur || moveCount < cur.moves;
    const newTime  = !cur || seconds < cur.seconds;
    writeStore(storageKey(), JSON.stringify({
      moves:   newMoves ? moveCount : cur.moves,
      seconds: newTime  ? seconds   : cur.seconds
    }));
    loadBest();
    return newMoves || newTime;
  }

  function clearRecords() {
    if (!window.confirm((size === 3 ? "9パズル" : "15パズル") + "の記録を消しますか？")) return;
    try { localStorage.removeItem(storageKey()); } catch (e) {}
    loadBest();
  }

  /* ---- 音 ---- */

  function getCtx() {
    if (!audioCtx) {
      const A = window.AudioContext || window.webkitAudioContext;
      if (A) audioCtx = new A();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function tone(freq, dur, type, vol, delay) {
    if (!soundOn()) return;
    const ctxA = getCtx();
    if (!ctxA) return;
    try {
      const t = ctxA.currentTime + (delay || 0);
      const osc = ctxA.createOscillator();
      const gain = ctxA.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain);
      gain.connect(ctxA.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    } catch (e) {}
  }

  function moveSound()    { tone(340, 0.06, "triangle", 0.05, 0); }
  function shuffleSound() { tone(220, 0.09, "square", 0.04, 0); tone(280, 0.09, "square", 0.04, 0.08); }
  function winSound(isNew) {
    [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.26, i < 3 ? "triangle" : "sine", 0.07, i * 0.12));
    if (isNew) [1568, 1760, 2093].forEach((f, i) => tone(f, 0.18, "sine", 0.06, 0.66 + i * 0.09));
  }

  /* ---- 時間 ---- */

  function stopTimer() {
    if (timerId) clearInterval(timerId);
    timerId = null;
  }

  function startTimer() {
    stopTimer();
    timerId = setInterval(() => { seconds++; updateStats(); }, 1000);
  }

  function updateStats() {
    moveCountEl.textContent = moveCount;
    timeCountEl.textContent = formatTime(seconds);
  }

  /* ---- 盤 ---- */

  function setMode(n) {
    size = n;
    boardEl.setAttribute("data-cols", String(n));
    mode9Btn.setAttribute("aria-pressed",  String(n === 3));
    mode15Btn.setAttribute("aria-pressed", String(n === 4));
    loadBest();
    resetSolved();
  }

  function resetSolved() {
    tiles = [];
    for (let i = 1; i < size * size; i++) tiles.push(i);
    tiles.push(0);
    emptyIndex = tiles.length - 1;
    moveCount = 0;
    seconds = 0;
    started = false;
    solved = false;
    winBanner.classList.remove("show");
    confettiLayer.innerHTML = "";
    stopTimer();
    updateStats();
    render();
  }

  function render() {
    boardEl.style.gridTemplateColumns = "repeat(" + size + ", 1fr)";
    boardEl.innerHTML = "";
    tiles.forEach((val, idx) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tile" + (val === 0 ? " empty" : "");
      b.textContent = val === 0 ? "" : String(val);
      b.disabled = (val === 0);
      b.setAttribute("aria-label", val === 0 ? "空きマス" : "数字 " + val);
      b.addEventListener("click", () => tryMove(idx));
      boardEl.appendChild(b);
    });
  }

  function tryMove(idx) {
    if (solved) return;
    const row = Math.floor(idx / size), col = idx % size;
    const erow = Math.floor(emptyIndex / size), ecol = emptyIndex % size;
    const next = (row === erow && Math.abs(col - ecol) === 1) ||
                 (col === ecol && Math.abs(row - erow) === 1);
    if (!next) return;

    if (!started) { started = true; startTimer(); }

    tiles[emptyIndex] = tiles[idx];
    tiles[idx] = 0;
    emptyIndex = idx;
    moveCount++;
    moveSound();
    updateStats();
    render();
    checkWin();
  }

  function isGoal(arr) {
    for (let i = 0; i < arr.length - 1; i++) if (arr[i] !== i + 1) return false;
    return arr[arr.length - 1] === 0;
  }

  function checkWin() {
    if (!isGoal(tiles)) return;
    solved = true;
    stopTimer();
    const isNew = saveBest();
    winBanner.textContent = isNew ? "できました！ 新記録です。" : "できました！ お見事です。";
    winBanner.classList.add("show");
    winSound(isNew);
    confetti(isNew ? 120 : 90);
  }

  /* ---- シャッフル（かならず解ける並びだけを作ります）---- */

  function solvable(arr, n) {
    const flat = arr.filter(v => v !== 0);
    let inv = 0;
    for (let i = 0; i < flat.length; i++)
      for (let j = i + 1; j < flat.length; j++)
        if (flat[i] > flat[j]) inv++;
    if (n % 2 === 1) return inv % 2 === 0;
    const rowFromBottom = n - Math.floor(arr.indexOf(0) / n);
    return (rowFromBottom % 2 === 0) ? (inv % 2 === 1) : (inv % 2 === 0);
  }

  function shuffle() {
    let arr;
    do {
      arr = [];
      for (let i = 1; i < size * size; i++) arr.push(i);
      arr.push(0);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
    } while (!solvable(arr, size) || isGoal(arr));

    tiles = arr;
    emptyIndex = tiles.indexOf(0);
    moveCount = 0;
    seconds = 0;
    started = false;
    solved = false;
    winBanner.classList.remove("show");
    confettiLayer.innerHTML = "";
    stopTimer();
    updateStats();
    render();
    shuffleSound();
  }

  /* ---- 紙ふぶき ---- */

  function confetti(count) {
    confettiLayer.innerHTML = "";
    const colors = ["#1e8a63", "#f2b84b", "#e56b6f", "#6c8cd5", "#8f6bc8"];
    for (let i = 0; i < count; i++) {
      const p = document.createElement("span");
      p.className = "confetti";
      p.style.left = (Math.random() * 100) + "vw";
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDuration = (2.2 + Math.random() * 1.8) + "s";
      p.style.animationDelay = (Math.random() * 0.35) + "s";
      p.style.setProperty("--drift", ((Math.random() - 0.5) * 220) + "px");
      confettiLayer.appendChild(p);
    }
    setTimeout(() => { confettiLayer.innerHTML = ""; }, 4600);
  }

  /* ---- ボタン ---- */

  mode9Btn.addEventListener("click",  () => setMode(3));
  mode15Btn.addEventListener("click", () => setMode(4));
  document.getElementById("shuffleBtn").addEventListener("click", shuffle);
  document.getElementById("resetBtn").addEventListener("click", resetSolved);
  document.getElementById("clearRecordsBtn").addEventListener("click", clearRecords);

  loadBest();
  resetSolved();
})();
</script>
</body>
</html>
