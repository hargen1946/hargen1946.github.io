<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハノイの塔</title>
<style>
  :root {
    --bg: #e8ede6;
    --panel: #f7f4ec;
    --board: #ddd6c4;
    --card: #fbf9f2;
    --border: #b9c7c0;
    --accent: #146c48;
    --accent2: #1f8a63;
    --text: #1c2a26;
    --muted: #4b5b56;
    --rod: #8d6e63;
    --rod-border: #624b42;
    --ok: #238b57;
    --ng: #b64034;
    --selected: #d27a24;
    --font: "Yu Gothic UI", "Meiryo", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 18px 14px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .game {
    width: 100%;
    max-width: 760px;
    padding: 22px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 16px 44px rgba(0,0,0,.14);
    overflow: hidden;
  }

  h1 {
    margin: 0 0 5px;
    text-align: center;
    color: var(--accent);
    font-size: 29px;
  }

  .subtitle {
    margin-bottom: 17px;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
  }

  .settings {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  label { font-weight: 700; color: var(--muted); }

  select {
    padding: 7px 12px;
    border: 2px solid var(--border);
    border-radius: 7px;
    background: var(--card);
    color: var(--accent);
    font: 700 18px var(--font);
    cursor: pointer;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 9px;
  }

  .stat {
    padding: 9px 6px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
  }

  .stat b {
    display: block;
    margin-top: 2px;
    color: var(--text);
    font-size: 21px;
  }

  .records {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 15px;
  }

  .record {
    padding: 9px;
    text-align: center;
    background: #eef5f1;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
  }

  .record b { margin-left: 5px; color: var(--accent); font-size: 18px; }

  .selection-status {
    min-height: 38px;
    margin-bottom: 8px;
    padding: 8px 12px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--muted);
    font-weight: 700;
  }

  .selection-status.active {
    color: #8a4b08;
    border-color: #d8a15e;
    background: #fff4df;
  }

  .board {
    height: 315px;
    padding: 18px 8px 0;
    display: flex;
    align-items: flex-end;
    background: var(--board);
    border: 1px solid var(--border);
    border-radius: 10px;
    user-select: none;
  }

  .peg {
    flex: 1;
    height: 100%;
    min-width: 0;
    padding-bottom: 19px;
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    position: relative;
    cursor: pointer;
    border: 3px solid transparent;
    border-radius: 10px 10px 0 0;
    transition: background .15s, border-color .15s;
  }

  .peg:hover { background: rgba(255,255,255,.20); }

  .peg.selected {
    background: rgba(210,122,36,.12);
    border-color: var(--selected);
  }

  .peg.can-move {
    background: rgba(35,139,87,.14);
    border-color: var(--ok);
  }

  .peg.cannot-move {
    background: rgba(182,64,52,.11);
    border-color: var(--ng);
  }

  .peg-state {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    min-width: 84px;
    padding: 4px 7px;
    border-radius: 999px;
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    opacity: 0;
    pointer-events: none;
  }

  .peg.can-move .peg-state {
    opacity: 1;
    color: #fff;
    background: var(--ok);
  }

  .peg.cannot-move .peg-state {
    opacity: 1;
    color: #fff;
    background: var(--ng);
  }

  .peg.selected .peg-state {
    opacity: 1;
    color: #fff;
    background: var(--selected);
  }

  .peg-label {
    position: absolute;
    top: -6px;
    z-index: 5;
    color: var(--muted);
    font-size: 15px;
    font-weight: 800;
  }

  .rod {
    position: absolute;
    bottom: 19px;
    z-index: 1;
    width: 30px;
    height: 228px;
    background: var(--rod);
    border: 2px solid var(--rod-border);
    border-radius: 12px 12px 2px 2px;
    box-shadow: inset 5px 0 rgba(255,255,255,.16);
    pointer-events: none;
  }

  .base {
    position: absolute;
    bottom: 0;
    z-index: 1;
    width: 92%;
    height: 19px;
    background: var(--rod);
    border: 2px solid var(--rod-border);
    border-radius: 6px;
    pointer-events: none;
  }

  .disk {
    height: 31px;
    margin-bottom: 3px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(0,0,0,.22);
    border-radius: 8px;
    color: white;
    font-size: 15px;
    font-weight: 800;
    text-shadow: 0 1px 2px rgba(0,0,0,.65);
    box-shadow: 0 3px 5px rgba(0,0,0,.24), inset 0 2px rgba(255,255,255,.25);
    pointer-events: none;
    transition: transform .12s;
  }

  .peg.selected .disk.top-disk {
    transform: translateY(-9px);
    outline: 3px solid rgba(210,122,36,.5);
  }

  .message {
    min-height: 24px;
    margin-top: 8px;
    text-align: center;
    color: var(--ng);
    font-size: 14px;
    font-weight: 800;
  }

  .win {
    display: none;
    margin-top: 10px;
    padding: 12px;
    text-align: center;
    color: var(--accent);
    background: rgba(31,138,99,.10);
    border: 2px solid var(--accent2);
    border-radius: 8px;
    font-size: 18px;
    font-weight: 800;
  }

  .win.show { display: block; }

  .controls {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  button {
    flex: 1;
    padding: 13px 8px;
    border: none;
    border-radius: 7px;
    background: var(--accent2);
    color: #fff;
    font: 700 16px var(--font);
    cursor: pointer;
  }

  button:hover { filter: brightness(1.08); }

  button.secondary {
    color: var(--muted);
    background: transparent;
    border: 2px solid var(--border);
  }

  .note {
    margin-top: 12px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.55;
  }

  .confetti {
    position: fixed;
    top: -25px;
    z-index: 9999;
    pointer-events: none;
    animation: fall linear forwards;
  }

  @keyframes fall {
    from { transform: translate3d(0,-20px,0) rotate(0deg); }
    to { transform: translate3d(var(--drift),110vh,0) rotate(960deg); }
  }

  @media (max-width: 570px) {
    body { padding: 9px 7px; }
    .game { padding: 15px 9px; }
    .board { height: 285px; padding-left: 3px; padding-right: 3px; }
    .rod { width: 25px; height: 205px; }
    .stats { gap: 4px; }
    .stat { padding: 7px 2px; font-size: 12px; }
    .stat b { font-size: 18px; }
    .records { grid-template-columns: 1fr; }
    .peg-state { min-width: 68px; font-size: 11px; }
    .disk { height: 29px; font-size: 14px; }
  }
</style>
</head>
<body>
<main class="game">
  <h1>ハノイの塔</h1>
  <div class="subtitle">すべての円ばんを、右のはしの棒に移しかえましょう</div>

  <div class="settings">
    <label for="diskCount">円ばんの数：</label>
    <select id="diskCount">
      <option value="3">3枚</option>
      <option value="4" selected>4枚</option>
      <option value="5">5枚</option>
      <option value="6">6枚</option>
      <option value="7">7枚</option>
    </select>
  </div>

  <section class="stats" aria-label="現在の成績">
    <div class="stat">手数<b id="moveCount">0</b></div>
    <div class="stat">所要時間<b id="elapsedTime">00:00</b></div>
    <div class="stat">最小手数<b id="minimumMoves">15</b></div>
  </section>

  <section class="records" aria-label="自己記録">
    <div class="record">手数の記録 <b id="bestMoves">―</b></div>
    <div class="record">時間の記録 <b id="bestTime">―</b></div>
  </section>

  <div id="selectionStatus" class="selection-status" aria-live="polite">
    動かしたい円ばんがある棒をクリックしてください
  </div>

  <div class="board" id="board">
    <div class="peg" data-peg="0" id="peg0">
      <div class="peg-label">A</div>
      <div class="peg-state">選択中</div>
      <div class="rod"></div>
      <div class="base"></div>
    </div>
    <div class="peg" data-peg="1" id="peg1">
      <div class="peg-label">B</div>
      <div class="peg-state">置けます</div>
      <div class="rod"></div>
      <div class="base"></div>
    </div>
    <div class="peg" data-peg="2" id="peg2">
      <div class="peg-label">C</div>
      <div class="peg-state">置けます</div>
      <div class="rod"></div>
      <div class="base"></div>
    </div>
  </div>

  <div class="message" id="message" aria-live="polite"></div>
  <div class="win" id="winBanner"></div>

  <div class="controls">
    <button type="button" id="restartButton">最初からやり直す</button>
    <button type="button" id="clearRecordsButton" class="secondary">記録を消す</button>
  </div>

  <div class="note">
    1回目のクリックで円ばんを選び、2回目のクリックで移動先を選びます。
  </div>
</main>

<script>
(() => {
  "use strict";

  const COLORS = ["#e53935","#fb8c00","#f6bf26","#43a047","#00a6a6","#1e88e5","#7e57c2"];
  const state = {
    diskCount: 4,
    pegs: [[], [], []],
    selectedPeg: null,
    moves: 0,
    solved: false,
    started: false,
    startTimestamp: 0,
    elapsedSeconds: 0,
    timerId: null,
    audioContext: null
  };

  const el = {
    diskCount: document.getElementById("diskCount"),
    moveCount: document.getElementById("moveCount"),
    elapsedTime: document.getElementById("elapsedTime"),
    minimumMoves: document.getElementById("minimumMoves"),
    bestMoves: document.getElementById("bestMoves"),
    bestTime: document.getElementById("bestTime"),
    selectionStatus: document.getElementById("selectionStatus"),
    message: document.getElementById("message"),
    winBanner: document.getElementById("winBanner"),
    restartButton: document.getElementById("restartButton"),
    clearRecordsButton: document.getElementById("clearRecordsButton"),
    pegs: [...document.querySelectorAll(".peg")]
  };

  function topDisk(pegIndex) {
    const peg = state.pegs[pegIndex];
    return peg.length ? peg[peg.length - 1] : null;
  }

  function minimumMoves() {
    return Math.pow(2, state.diskCount) - 1;
  }

  function recordKey(kind) {
    return `hanoi_${kind}_${state.diskCount}`;
  }

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }

  function loadRecords() {
    const bestMoves = localStorage.getItem(recordKey("bestMoves"));
    const bestTime = localStorage.getItem(recordKey("bestTime"));
    el.bestMoves.textContent = bestMoves ? `${bestMoves}手` : "―";
    el.bestTime.textContent = bestTime ? formatTime(Number(bestTime)) : "―";
  }

  function saveRecords() {
    const oldMoves = Number(localStorage.getItem(recordKey("bestMoves"))) || Infinity;
    const oldTime = Number(localStorage.getItem(recordKey("bestTime"))) || Infinity;
    if (state.moves < oldMoves) localStorage.setItem(recordKey("bestMoves"), String(state.moves));
    if (state.elapsedSeconds < oldTime) localStorage.setItem(recordKey("bestTime"), String(state.elapsedSeconds));
    loadRecords();
  }

  function clearTimer() {
    if (state.timerId !== null) {
      clearInterval(state.timerId);
      state.timerId = null;
    }
  }

  function updateElapsed() {
    if (!state.started) return;
    state.elapsedSeconds = Math.floor((Date.now() - state.startTimestamp) / 1000);
    el.elapsedTime.textContent = formatTime(state.elapsedSeconds);
  }

  function startTimer() {
    if (state.started || state.solved) return;
    state.started = true;
    state.startTimestamp = Date.now();
    state.timerId = window.setInterval(updateElapsed, 250);
  }

  function stopTimer() {
    updateElapsed();
    clearTimer();
  }

  function canMove(fromIndex, toIndex) {
    const moving = topDisk(fromIndex);
    const target = topDisk(toIndex);
    return moving !== null && (target === null || moving < target);
  }

  function resetGame() {
    clearTimer();
    state.pegs = [[], [], []];
    for (let size = state.diskCount; size >= 1; size--) state.pegs[0].push(size);
    state.selectedPeg = null;
    state.moves = 0;
    state.solved = false;
    state.started = false;
    state.startTimestamp = 0;
    state.elapsedSeconds = 0;

    el.moveCount.textContent = "0";
    el.elapsedTime.textContent = "00:00";
    el.minimumMoves.textContent = String(minimumMoves());
    el.message.textContent = "";
    el.winBanner.classList.remove("show");
    el.selectionStatus.classList.remove("active");
    el.selectionStatus.textContent = "動かしたい円ばんがある棒をクリックしてください";

    loadRecords();
    render();
  }

  function render() {
    el.pegs.forEach((pegElement, pegIndex) => {
      pegElement.querySelectorAll(".disk").forEach(node => node.remove());
      pegElement.classList.remove("selected","can-move","cannot-move");

      state.pegs[pegIndex].forEach((diskSize, index, array) => {
        const disk = document.createElement("div");
        disk.className = "disk";
        if (index === array.length - 1) disk.classList.add("top-disk");
        disk.style.width = `${28 + (diskSize / state.diskCount) * 66}%`;
        disk.style.background = COLORS[(diskSize - 1) % COLORS.length];
        disk.textContent = String(diskSize);
        pegElement.appendChild(disk);
      });

      const badge = pegElement.querySelector(".peg-state");
      if (state.selectedPeg === null) {
        badge.textContent = "";
      } else if (pegIndex === state.selectedPeg) {
        pegElement.classList.add("selected");
        badge.textContent = "選択中";
      } else if (canMove(state.selectedPeg, pegIndex)) {
        pegElement.classList.add("can-move");
        badge.textContent = "置けます";
      } else {
        pegElement.classList.add("cannot-move");
        badge.textContent = "置けません";
      }
    });
  }

  function selectPeg(pegIndex) {
    const disk = topDisk(pegIndex);
    if (disk === null) {
      el.message.textContent = "この棒には動かせる円ばんがありません。";
      return;
    }
    state.selectedPeg = pegIndex;
    el.message.textContent = "";
    el.selectionStatus.classList.add("active");
    el.selectionStatus.textContent = `円ばん ${disk} を選択中です。緑色の棒へ移動できます。`;
    render();
  }

  function cancelSelection() {
    state.selectedPeg = null;
    el.message.textContent = "";
    el.selectionStatus.classList.remove("active");
    el.selectionStatus.textContent = "選択を取り消しました。動かしたい円ばんを選んでください";
    render();
  }

  function moveSelectedDisk(toIndex) {
    const fromIndex = state.selectedPeg;
    const moving = topDisk(fromIndex);
    const target = topDisk(toIndex);

    if (!canMove(fromIndex, toIndex)) {
      const targetText = target === null ? "空の棒" : `円ばん ${target}`;
      el.message.textContent = `円ばん ${moving} は ${targetText} の上には置けません。`;
      state.selectedPeg = null;
      el.selectionStatus.classList.remove("active");
      el.selectionStatus.textContent = "もう一度、動かしたい円ばんを選んでください";
      render();
      return;
    }

    startTimer();
    const removed = state.pegs[fromIndex].pop();

    if (removed !== moving) {
      // 状態に矛盾が起きた場合は安全に元へ戻す
      if (removed !== undefined) state.pegs[fromIndex].push(removed);
      state.selectedPeg = null;
      el.message.textContent = "移動をやり直してください。";
      render();
      return;
    }

    state.pegs[toIndex].push(moving);
    state.moves += 1;
    state.selectedPeg = null;
    el.moveCount.textContent = String(state.moves);
    el.message.textContent = "";
    el.selectionStatus.classList.remove("active");
    el.selectionStatus.textContent = "次に動かしたい円ばんがある棒をクリックしてください";
    render();
    checkWin();
  }

  function handlePegClick(pegIndex) {
    if (state.solved) return;

    if (state.selectedPeg === null) {
      selectPeg(pegIndex);
      return;
    }

    if (pegIndex === state.selectedPeg) {
      cancelSelection();
      return;
    }

    moveSelectedDisk(pegIndex);
  }

  function checkWin() {
    if (state.pegs[2].length !== state.diskCount) return;
    state.solved = true;
    stopTimer();
    saveRecords();

    const perfect = state.moves === minimumMoves();
    el.winBanner.textContent = perfect
      ? `最小手数で完成！　${state.moves}手・${formatTime(state.elapsedSeconds)}`
      : `完成！　${state.moves}手・${formatTime(state.elapsedSeconds)}`;
    el.winBanner.classList.add("show");
    el.selectionStatus.textContent = "お見事です。完成しました！";
    playFanfare();
    launchConfetti();
  }

  function clearRecords() {
    if (!window.confirm(`${state.diskCount}枚の記録を消しますか？`)) return;
    localStorage.removeItem(recordKey("bestMoves"));
    localStorage.removeItem(recordKey("bestTime"));
    loadRecords();
  }

  function audioCtx() {
    if (!state.audioContext) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) state.audioContext = new AudioContextClass();
    }
    return state.audioContext;
  }

  function tone(ctx, frequency, start, duration, volume) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(frequency, start);
    gain.gain.setValueAtTime(0.001, start);
    gain.gain.exponentialRampToValueAtTime(volume, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + duration + 0.04);
  }

  function playFanfare() {
    const ctx = audioCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();

    const start = ctx.currentTime + 0.04;
    [
      [523.25,0.00,0.20,0.13],
      [659.25,0.20,0.20,0.13],
      [783.99,0.40,0.24,0.14],
      [1046.50,0.67,0.60,0.18],
      [783.99,0.72,0.46,0.12],
      [659.25,0.77,0.42,0.10]
    ].forEach(([f,o,d,v]) => tone(ctx,f,start+o,d,v));
  }

  function launchConfetti() {
    const colors = COLORS;
    for (let i = 0; i < 130; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti";
      piece.style.left = `${Math.random() * 100}vw`;
      piece.style.width = `${7 + Math.random() * 8}px`;
      piece.style.height = `${10 + Math.random() * 13}px`;
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.borderRadius = Math.random() > .65 ? "50%" : "2px";
      piece.style.animationDuration = `${2.8 + Math.random() * 2.1}s`;
      piece.style.animationDelay = `${Math.random() * .55}s`;
      piece.style.setProperty("--drift", `${(Math.random() - .5) * 220}px`);
      document.body.appendChild(piece);
      window.setTimeout(() => piece.remove(), 5600);
    }
  }

  el.pegs.forEach((pegElement, pegIndex) => {
    pegElement.addEventListener("click", () => handlePegClick(pegIndex));
  });

  el.diskCount.addEventListener("change", () => {
    state.diskCount = Number(el.diskCount.value);
    resetGame();
  });

  el.restartButton.addEventListener("click", resetGame);
  el.clearRecordsButton.addEventListener("click", clearRecords);

  resetGame();
})();
</script>
</body>
</html>
