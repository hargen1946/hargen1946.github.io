<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ローレンツ・アトラクター実験</title>
<style>
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#0d1117;
    color:#f0f3f6;
  }
  .wrap{
    max-width:470px;
    margin:0 auto;
    padding:20px 8px 8px;
  }
  h1{
    margin:0 0 8px;
    font-size:19px;
    line-height:1.3;
  }
  button{
    border:0;
    border-radius:9px;
    padding:8px 12px;
    font-size:13px;
    cursor:pointer;
    color:white;
    background:#238636;
  }
  #toggleBtn{
    display:block;
    margin:0 0 12px;
    min-width:110px;
    min-height:44px;
    font-size:16px;
    font-weight:700;
  }
  .canvasbox{
    position:relative;
    background:#05070a;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 12px rgba(0,0,0,.35);
    margin-bottom:8px;
  }
  canvas{
    width:100%;
    height:auto;
    display:block;
  }
  .formula{
    font-family:"Cambria Math","Times New Roman",serif;
    font-size:19px;
    line-height:1.75;
    text-align:center;
    color:#ffffff;
    margin:6px 0 10px;
  }
  .intro{
    position:absolute;
    top:16%;
    left:6%;
    width:88%;
    padding:16px 10px;
    border-radius:12px;
    background:rgba(8,15,24,.9);
    text-align:center;
  }
  .intro[hidden]{ display:none; }
  .intro-title{ margin:0 0 6px; font-size:16px; font-weight:700; }
  .intro-text{ margin:10px 0 0; color:#d5e2eb; font-size:14px; line-height:1.6; }
  .back-link{
  display:inline-block;
  margin-bottom:20px;
  padding:8px 12px;
  border-radius:9px;
  background:#238636;
  color:white;
  text-decoration:none;
  font-size:13px;
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="/">← ゲームひろばへ戻る</a>
  <h1>ローレンツ・アトラクター実験</h1>
  <button id="toggleBtn" type="button">開始</button>

  <div class="canvasbox">
    <canvas id="canvas" width="450" height="620"></canvas>
    <div class="intro" id="intro">
      <p class="intro-title">ローレンツ方程式</p>
      <div class="formula">
        dx/dt = σ(y − x)<br>
        dy/dt = x(ρ − z) − y<br>
        dz/dt = xy − βz
      </div>
      <p class="intro-text">開始ボタンを押すと、この数式に従ったカオスの軌跡が現れます。</p>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const toggleBtn = document.getElementById("toggleBtn");
const intro = document.getElementById("intro");

let running = false;

const sigma = 10;
const rho = 28;
const beta = 8/3;

let x, y, z;
let points = [];

function reset(){
  x = 0.1;
  y = 0;
  z = 0;
  points = [];
  running = false;
  toggleBtn.textContent = "開始";
  intro.hidden = false;
  ctx.fillStyle = "#05070a";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  draw();
}

function step(dt){
  const dx = sigma * (y - x);
  const dy = x * (rho - z) - y;
  const dz = x * y - beta * z;

  x += dx * dt;
  y += dy * dt;
  z += dz * dt;
}

function project(px,pz){
  const scaleX = 9.4;
  const scaleZ = 9.5;
  return {
    sx: canvas.width/2 + px*scaleX,
    sy: 560 - pz*scaleZ
  };
}

function draw(){
  ctx.fillStyle = "rgba(5,7,10,0.15)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(points.length > 1){
    for(let i=1;i<points.length;i++){
      const a = points[i-1];
      const b = points[i];
      const t = i / points.length;
      const hue = 185 + 115*t;

      ctx.strokeStyle = `hsla(${hue},90%,65%,0.72)`;
      ctx.lineWidth = 1.35;
      ctx.beginPath();
      ctx.moveTo(a.sx,a.sy);
      ctx.lineTo(b.sx,b.sy);
      ctx.stroke();
    }
  }

  if(points.length){
    const p = points[points.length-1];
    ctx.beginPath();
    ctx.arc(p.sx,p.sy,4,0,Math.PI*2);
    ctx.fillStyle="#fff";
    ctx.fill();
  }

  ctx.fillStyle="rgba(255,255,255,.75)";
  ctx.font="14px system-ui,sans-serif";
  ctx.fillText("カオスの軌跡",14,24);
}

function animate(){
  if(running){
    for(let i=0;i<7;i++){
      step(0.006);
      points.push(project(x,z));
      if(points.length > 2800) points.shift();
    }
  }

  draw();
  requestAnimationFrame(animate);
}

toggleBtn.addEventListener("click",()=>{
  if(!running && toggleBtn.textContent==="開始"){
    running = true;
    toggleBtn.textContent = "最初に戻す";
    intro.hidden = true;
  }else{
    reset();
  }
});

reset();
requestAnimationFrame(animate);
</script>
</body>
</html>
