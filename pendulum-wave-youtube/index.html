<style>



html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

<body>

<div class="wrap">

 
  <h1>振り子ウェーブシミュレーター</h1>

  <div class="topbar">
    <div class="toprow">

      <div class="desc" id="statusText">
        長さの異なる多数の振り子を横から見たものです。
        最初は静止しています。
        <strong>設定</strong>を押して調整し、
        <strong>閉じる</strong>を押すと最初から動きます。
      </div>

      <button id="toggleBtn">設定</button>

    </div>
  </div>

  <div class="panel" id="settingsPanel">

    <div class="controls">

      <label>
        振り子の本数：
        <span class="value" id="countText">15</span>
        <input id="count" type="range"
               min="6" max="20" value="15" step="1">
      </label>

      <label>
        動きの速さ：
        <span class="value" id="speedText">1.00</span>
        <input id="speed" type="range"
               min="0.25" max="2.00" value="1.00" step="0.05">
      </label>

      <label>
        振れ幅：
        <span class="value" id="ampText">55°</span>
        <input id="amp" type="range"
               min="10" max="70" value="55" step="1">
      </label>

      <label>
        残像：
        <span class="value" id="trailText">なし</span>
        <input id="trail" type="range"
               min="0" max="1" value="0" step="1">
      </label>

    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="canvas" width="1280" height="720"></canvas>
  </div>

  

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const panel = document.getElementById("settingsPanel");
const toggleBtn = document.getElementById("toggleBtn");
const statusText = document.getElementById("statusText");

const countSlider = document.getElementById("count");
const speedSlider = document.getElementById("speed");
const ampSlider = document.getElementById("amp");
const trailSlider = document.getElementById("trail");

const countText = document.getElementById("countText");
const speedText = document.getElementById("speedText");
const ampText = document.getElementById("ampText");
const trailText = document.getElementById("trailText");

let settingsOpen = false;
let running = false;
let simElapsed = 0;
let lastFrame = performance.now();
let prevTrailState = null;

function updateLabels() {
  countText.textContent = countSlider.value;
  speedText.textContent =
    Number(speedSlider.value).toFixed(2);
  ampText.textContent =
    `${ampSlider.value}°`;
  trailText.textContent =
    trailSlider.value === "1" ? "あり" : "なし";
}

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function restartAndRun() {
  simElapsed = 0;
  running = true;
  clearCanvas();
  prevTrailState = null;

  statusText.innerHTML =
    '再生中です。もう一度<strong>設定</strong>を押すと止めて設定できます。';
}

function stopForSettings() {
  running = false;

  statusText.innerHTML =
    '設定を変えたら<strong>閉じる</strong>を押してください。最初から動きます。';
}

function openSettings() {
  settingsOpen = true;
  panel.classList.add("open");
  toggleBtn.textContent = "閉じる";
  stopForSettings();
}

function closeSettingsAndStart() {
  settingsOpen = false;
  panel.classList.remove("open");
  toggleBtn.textContent = "設定";
  restartAndRun();
}

function drawScene(t) {

  const W = canvas.width;
  const H = canvas.height;

  const trailsOn =
    trailSlider.value === "1";

  if (
    prevTrailState === null ||
    prevTrailState !== trailsOn
  ) {
    clearCanvas();
    prevTrailState = trailsOn;
  }

  if (trailsOn && running) {

    ctx.fillStyle =
      "rgba(255,255,255,0.18)";

    ctx.fillRect(0, 0, W, H);

  } else {

    clearCanvas();

  }

  const count =
    Number(countSlider.value);

  const speed =
    Number(speedSlider.value);

  const amp =
    Number(ampSlider.value) *
    Math.PI / 180;

  const time = t * speed;

  /* YouTube横長画面用 */
  const topY = 90;
  const minLen = 260;
  const maxLen = 540;

  const pivotX = W / 2;
  const supportHalfWidth = 150;

  /* 支点 */
  ctx.beginPath();
  ctx.moveTo(
    pivotX - supportHalfWidth,
    topY
  );

  ctx.lineTo(
    pivotX + supportHalfWidth,
    topY
  );

  ctx.strokeStyle = "#222";
  ctx.lineWidth = 5;
  ctx.stroke();

  for (let i = 0; i < count; i++) {

    const ratio =
      i / Math.max(1, count - 1);

    const len =
      minLen +
      (maxLen - minLen) * ratio;

    const baseFreq = 1.55;
    const freq =
      baseFreq + i * 0.035;

    const angle =
      amp * Math.sin(freq * time);

    const x =
      pivotX +
      Math.sin(angle) * len;

    const y =
      topY +
      Math.cos(angle) * len;

    /* 糸 */
    ctx.beginPath();
    ctx.moveTo(pivotX, topY);
    ctx.lineTo(x, y);

    ctx.strokeStyle =
      "rgba(40,40,40,0.72)";

    ctx.lineWidth = 2;
    ctx.stroke();

    /* 支点 */
    ctx.beginPath();

    ctx.arc(
      pivotX,
      topY,
      3,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#222";
    ctx.fill();

    /* 振り子 */
    const hue =
      200 + i * 4;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      11,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      `hsl(${hue},70%,55%)`;

    ctx.fill();
  }

 
}

function animate(now) {

  const dt =
    Math.min(
      (now - lastFrame) / 1000,
      0.03
    );

  lastFrame = now;

  if (running) {
    simElapsed += dt;
  }

  drawScene(simElapsed);

  requestAnimationFrame(animate);
}

toggleBtn.addEventListener(
  "click",
  () => {

    if (!settingsOpen) {
      openSettings();
    } else {
      closeSettingsAndStart();
    }

  }
);

[
  countSlider,
  speedSlider,
  ampSlider,
  trailSlider

].forEach(el => {

  el.addEventListener(
    "input",
    () => {

      updateLabels();

      if (!running) {
        drawScene(0);
      }

    }
  );

});

updateLabels();
drawScene(0);
requestAnimationFrame(animate);

</script>

</body>
</html>
