<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スライドパズル</title>
<style>
  :root {
    --bg: #eef3ef;
    --panel: rgba(255,255,255,.88);
    --grid-bg: #d8e2dc;
    --tile: #ffffff;
    --tile-hover: #eef9f4;
    --accent: #1e8a63;
    --accent-2: #72b89b;
    --text: #20302a;
    --text-dim: #63736d;
    --line: #cbd8d1;
    --shadow: 0 16px 40px rgba(31,58,47,.16);
    --mono: "JetBrains Mono", "Yu Gothic UI", "Meiryo", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: var(--mono);
    background:
      radial-gradient(circle at top left, rgba(114,184,155,.18), transparent 30%),
      linear-gradient(135deg, #f5f8f6, var(--bg));
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 8px 12px 12px;
  }

  .console {
    width: min(94vw, 820px);
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.75);
    border-radius: 18px;
    padding: 12px 16px 16px;
    margin-top: 0;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  h1 {
    font-size: clamp(20px, 3vw, 28px);
    letter-spacing: .04em;
    margin: 0;
    color: var(--accent);
    font-weight: 800;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin: 2px 0 0;
  }

  .sound-btn {
    border: 1px solid var(--line);
    background: rgba(255,255,255,.75);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 8px 11px;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    transition: .18s ease;
    white-space: nowrap;
  }

  .sound-btn:hover { transform: translateY(-1px); border-color: var(--accent-2); }

  .modes {
    display: grid;
    grid-template-columns: 1fr;
    gap: 7px;
  }

  .mode-btn {
    background: rgba(255,255,255,.62);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 800;
    padding: 10px 8px;
    cursor: pointer;
    border-radius: 10px;
    transition: .16s ease;
  }

  .mode-btn:hover { border-color: var(--accent-2); color: var(--text); }
  .mode-btn.active {
    color: white;
    border-color: var(--accent);
    background: #dcebdd;
    box-shadow: 0 6px 16px rgba(30,138,99,.22);
  }

  .game-area {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 220px;
    gap: 14px;
    align-items: start;
  }

  .board-wrap { min-width: 0; max-width: 430px; }

  .stats {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 8px;
    padding: 0 2px;
  }

  .stats b { color: var(--text); }

  .board {
    position: relative;
    display: grid;
    gap: 5px;
    background: linear-gradient(145deg, #cdd8d2, #e7eee9);
    border: 1px solid #c7d3cd;
    padding: 6px;
    border-radius: 14px;
    width: 100%;
    max-width: 430px;
    aspect-ratio: 1 / 1;
    box-shadow: inset 0 2px 8px rgba(52,77,66,.12);
  }

  .tile {
    background: linear-gradient(145deg, #ffffff, #f6faf8);
    border: 1px solid #b8c9c0;
    box-shadow: 0 3px 8px rgba(34,61,49,.10);
    color: #126846;
    font-family: var(--mono);
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    border-radius: 10px;
    transition: transform .16s cubic-bezier(.2,.8,.2,1), box-shadow .16s ease, background .16s ease;
    will-change: transform;
  }

  .tile:hover { background: var(--tile-hover); box-shadow: 0 5px 12px rgba(34,61,49,.14); }
  .tile.moving { animation: pop .16s ease; }
  @keyframes pop { 50% { transform: scale(.93); } }

  .tile.empty {
    background: rgba(255,255,255,.28);
    border: 1px dashed #b8c8c0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
    cursor: default;
  }

  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .side-title {
    font-size: 12px;
    font-weight: 800;
    color: var(--text-dim);
    letter-spacing: .04em;
    margin: 1px 0 -1px;
  }

  .side-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }

  .stat-box {
    padding: 8px 6px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: rgba(255,255,255,.62);
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
  }

  .stat-box b {
    display: block;
    margin-top: 2px;
    color: var(--text);
    font-size: 17px;
  }

  .btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #2aa876);
    color: #fff;
    border: none;
    font: inherit;
    font-weight: 800;
    font-size: 15px;
    padding: 12px 10px;
    cursor: pointer;
    border-radius: 10px;
    transition: transform .15s ease, filter .15s ease;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
  .btn.secondary { background: #ecefee; color: var(--text-dim); border: 1px solid var(--line); }

  .mode-btn { background: #dfeaf4; }
  .mode-btn.active { color: #284d64; border-color: #9fbdd2; background: #cbddeb; box-shadow: 0 6px 16px rgba(67,101,124,.15); }

  .record-card { margin-top: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.62); }
  .record-title, .best-header { display:flex; justify-content:space-between; gap:10px; font-size:12px; font-weight:800; color:var(--text-dim); margin-bottom:7px; }
  .record-line, .best-line { display:flex; justify-content:space-between; gap:14px; font-size:15px; font-weight:700; }
  .best-line { font-size:14px; margin-bottom:8px; }
  .best-mode { color:var(--accent); }
  .best-reset { width:100%; border:1px solid var(--line); background:#ecefee; color:var(--text-dim); border-radius:8px; padding:8px; font:inherit; font-weight:700; cursor:pointer; }

  .info-card {
    padding: 10px 11px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(255,255,255,.56);
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.55;
  }


  .back-btn {
    margin-top: auto;
    display: block;
    width: 100%;
    padding: 11px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #f4f6f5;
    color: var(--text-dim);
    text-align: center;
    text-decoration: none;
    font-size: 14px;
    font-weight: 800;
    transition: transform .15s ease, background .15s ease;
  }
  .back-btn:hover {
    transform: translateY(-1px);
    background: #e8ecea;
  }

  .win-banner {
    display: none;
    margin-top: 8px;
    text-align: center;
    font-size: 15px;
    font-weight: 900;
    color: var(--accent);
    border: 1px solid rgba(30,138,99,.28);
    background: rgba(30,138,99,.08);
    padding: 9px;
    border-radius: 10px;
  }
  .win-banner.show { display: block; animation: winPop .35s ease; }
  @keyframes winPop { from { opacity:0; transform: scale(.95); } to { opacity:1; transform:scale(1); } }

  .confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 9999;
  }
  .confetti {
    position: absolute;
    top: -20px;
    width: 10px;
    height: 16px;
    border-radius: 2px;
    opacity: .95;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translate3d(var(--drift), 110vh, 0) rotate(720deg); opacity: .9; }
  }

  @media (max-width: 700px) {
    .console { width: min(96vw, 520px); padding: 12px; }
    .game-area { grid-template-columns: 1fr; gap: 10px; }
    .side-panel { display: grid; grid-template-columns: 1fr 1fr; }
    .side-title, .modes, .side-stats, .info-card, .sound-btn, .back-btn { grid-column: 1 / -1; }
    .modes { grid-template-columns: 1fr 1fr; }
    .board { max-width: min(84vw, 430px); margin: 0 auto; }
  }

  @media (max-height: 720px) and (min-width: 701px) {
    .console { margin-top: 0; }
    .board { max-width: min(58vh, 470px); }
    .mode-btn { padding: 8px; }
    .top-row { margin-bottom: 8px; }
  }
</style>
</head>
<body>
<div class="confetti-layer" id="confettiLayer"></div>
<div class="console">
  <div class="top-row">
    <div>
      <h1>スライドパズル</h1>
      <div class="subtitle">数字を順番に並べて完成させましょう</div>
    </div>
  </div>

  <div class="game-area">
    <div class="board-wrap">
      <div class="board" id="board" aria-label="スライドパズル盤"></div>
      <div class="win-banner" id="winBanner">🎉 できました！ お見事です。</div>
      <div class="record-card">
        <div class="record-title"><span>現在の記録</span></div>
        <div class="record-line"><span>手数 <b id="moveCount">0</b></span><span>時間 <b id="timeCount">00:00</b></span></div>
      </div>
      <div class="record-card">
        <div class="best-header"><span>ベスト記録</span><span class="best-mode" id="bestModeName">9パズル</span></div>
        <div class="best-line"><span>最少手数 <b id="bestMoves">--</b></span><span>最短時間 <b id="bestTime">--:--</b></span></div>
        <button class="best-reset" type="button" onclick="resetBestRecord()">記録をリセット</button>
      </div>
    </div>

    <div class="side-panel">
      <div class="side-title">ゲームを選ぶ</div>
      <div class="modes">
        <button class="mode-btn active" id="mode9" onclick="setMode(3)">9パズル (3×3)</button>
        <button class="mode-btn" id="mode15" onclick="setMode(4)">15パズル (4×4)</button>
      </div>

      <div class="side-title">操作</div>
      <button class="btn" onclick="shuffle()">シャッフル</button>
      <button class="btn secondary" onclick="resetSolved()">リセット</button>
      <button class="sound-btn" id="soundBtn" type="button" onclick="toggleSound()">🔊 音あり</button>

      <div class="info-card"><strong>遊び方</strong><br>空いているマスのとなりのピースをクリック（タップ）すると動きます。最初の一手でタイマーが始まります。</div>
      <a class="back-btn" href="../">← ゲームひろばへ戻る</a>
    </div>
  </div>
</div>
<script>
  let size = 3;
  let tiles = [];
  let emptyIndex = 0;
  let moveCount = 0;
  let timerInterval = null;
  let seconds = 0;
  let started = false;
  let solved = false;
  let soundEnabled = true;
  let audioCtx = null;

  const boardEl = document.getElementById('board');
  const moveCountEl = document.getElementById('moveCount');
  const timeCountEl = document.getElementById('timeCount');
  const winBanner = document.getElementById('winBanner');
  const soundBtn = document.getElementById('soundBtn');
  const confettiLayer = document.getElementById('confettiLayer');
  const bestMovesEl = document.getElementById('bestMoves');
  const bestTimeEl = document.getElementById('bestTime');
  const bestModeNameEl = document.getElementById('bestModeName');

  function storageKey() { return `slidePuzzleBest_${size}`; }

  function formatTime(totalSeconds) {
    const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
    const s = String(totalSeconds % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function loadBestRecord() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(storageKey()) || 'null'); } catch (_) {}
    bestMovesEl.textContent = saved?.moves ?? '--';
    bestTimeEl.textContent = Number.isFinite(saved?.seconds) ? formatTime(saved.seconds) : '--:--';
    bestModeNameEl.textContent = size === 3 ? '9パズル' : '15パズル';
  }

  function saveBestRecord() {
    let current = null;
    try { current = JSON.parse(localStorage.getItem(storageKey()) || 'null'); } catch (_) {}
    const isNewMoves = !current || moveCount < current.moves;
    const isNewTime = !current || seconds < current.seconds;
    const next = { moves: isNewMoves ? moveCount : current.moves, seconds: isNewTime ? seconds : current.seconds };
    localStorage.setItem(storageKey(), JSON.stringify(next));
    loadBestRecord();
    return isNewMoves || isNewTime;
  }

  function resetBestRecord() {
    if (!confirm('ベスト記録をリセットしますか？\n\nこの操作は元に戻せません。')) return;
    localStorage.removeItem(storageKey());
    loadBestRecord();
  }

  function getAudioContext() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playTone(freq, duration = 0.06, type = 'sine', volume = 0.035) {
    if (!soundEnabled) return;
    try {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (_) {}
  }

  function playMoveSound() { playTone(340, .055, 'triangle', .028); }
  function playShuffleSound() { playTone(220, .08, 'square', .018); setTimeout(() => playTone(280, .08, 'square', .018), 70); }
  function playWinSound(isNewRecord = false) {
    [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => playTone(f, .28, i < 3 ? 'triangle' : 'sine', .045), i * 120));
    if (isNewRecord) [1568, 1760, 2093].forEach((f, i) => setTimeout(() => playTone(f, .18, 'sine', .035), 650 + i * 90));
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '🔊 音あり' : '🔇 音なし';
    if (soundEnabled) playTone(440, .08, 'sine', .025);
  }

  function setMode(n) {
    size = n;
    document.getElementById('mode9').classList.toggle('active', n === 3);
    document.getElementById('mode15').classList.toggle('active', n === 4);
    loadBestRecord();
    resetSolved();
  }

  function resetSolved() {
    tiles = [...Array(size * size - 1).keys()].map(i => i + 1);
    tiles.push(0);
    emptyIndex = tiles.length - 1;
    moveCount = 0;
    seconds = 0;
    started = false;
    solved = false;
    winBanner.classList.remove('show');
    confettiLayer.innerHTML = '';
    updateStats();
    stopTimer();
    render();
  }

  function render(movedIndex = -1) {
    boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    boardEl.innerHTML = '';
    const fontSize = size === 3 ? 'clamp(34px, 6vw, 54px)' : 'clamp(25px, 4vw, 38px)';
    tiles.forEach((val, idx) => {
      const div = document.createElement('button');
      div.type = 'button';
      div.className = 'tile' + (val === 0 ? ' empty' : '') + (idx === movedIndex ? ' moving' : '');
      div.style.fontSize = fontSize;
      div.textContent = val === 0 ? '' : val;
      div.disabled = val === 0;
      div.setAttribute('aria-label', val === 0 ? '空きマス' : `数字 ${val}`);
      div.onclick = () => tryMove(idx);
      boardEl.appendChild(div);
    });
  }

  function tryMove(idx) {
    if (solved) return;
    const row = Math.floor(idx / size);
    const col = idx % size;
    const erow = Math.floor(emptyIndex / size);
    const ecol = emptyIndex % size;
    const adjacent =
      (row === erow && Math.abs(col - ecol) === 1) ||
      (col === ecol && Math.abs(row - erow) === 1);

    if (!adjacent) return;
    if (!started) { started = true; startTimer(); }

    const oldEmpty = emptyIndex;
    [tiles[idx], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[idx]];
    emptyIndex = idx;
    moveCount++;
    playMoveSound();
    updateStats();
    render(oldEmpty);
    checkWin();
  }

  function checkWin() {
    const goal = [...Array(size * size - 1).keys()].map(i => i + 1);
    goal.push(0);
    const isSolved = tiles.every((v, i) => v === goal[i]);
    if (isSolved) {
      solved = true;
      stopTimer();
      const isNewRecord = saveBestRecord();
      winBanner.textContent = isNewRecord ? '🎉 できました！ 新記録です！' : '🎉 できました！ お見事です。';
      winBanner.classList.add('show');
      playWinSound(isNewRecord);
      launchConfetti(isNewRecord ? 150 : 100);
    }
  }

  function updateStats() {
    moveCountEl.textContent = moveCount;
    timeCountEl.textContent = formatTime(seconds);
  }

  function startTimer() {
    stopTimer();
    timerInterval = setInterval(() => { seconds++; updateStats(); }, 1000);
  }

  function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
  }

  function isSolvable(arr, n) {
    const flat = arr.filter(v => v !== 0);
    let inversions = 0;
    for (let i = 0; i < flat.length; i++) {
      for (let j = i + 1; j < flat.length; j++) {
        if (flat[i] > flat[j]) inversions++;
      }
    }
    if (n % 2 === 1) return inversions % 2 === 0;
    const emptyRowFromBottom = n - Math.floor(arr.indexOf(0) / n);
    return emptyRowFromBottom % 2 === 0 ? inversions % 2 === 1 : inversions % 2 === 0;
  }

  function shuffle() {
    let arr;
    do {
      arr = [...Array(size * size - 1).keys()].map(i => i + 1);
      arr.push(0);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    } while (!isSolvable(arr, size) || isAlreadySolved(arr));

    tiles = arr;
    emptyIndex = tiles.indexOf(0);
    moveCount = 0;
    seconds = 0;
    started = false;
    solved = false;
    winBanner.classList.remove('show');
    confettiLayer.innerHTML = '';
    stopTimer();
    updateStats();
    render();
    playShuffleSound();
  }

  function isAlreadySolved(arr) {
    const goal = [...Array(size * size - 1).keys()].map(i => i + 1);
    goal.push(0);
    return arr.every((v, i) => v === goal[i]);
  }

  function launchConfetti(count = 90) {
    confettiLayer.innerHTML = '';
    const colors = ['#1e8a63', '#f2b84b', '#e56b6f', '#6c8cd5', '#8f6bc8', '#ffffff'];
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('span');
      piece.className = 'confetti';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
      piece.style.animationDelay = (Math.random() * .35) + 's';
      piece.style.setProperty('--drift', ((Math.random() - .5) * 220) + 'px');
      confettiLayer.appendChild(piece);
    }
    setTimeout(() => { confettiLayer.innerHTML = ''; }, 4600);
  }

  loadBestRecord();
  resetSolved();
</script>
</body>
</html>
